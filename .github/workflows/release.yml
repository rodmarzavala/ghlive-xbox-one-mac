name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.1.0 or 0.1.0-beta.1). Must match the VERSION file."
        required: true
        type: string
  push:
    tags: ["v*"]

# Both triggers resolve to the tag name, so a dispatch and a tag push for one version serialise.
concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    # Manual releases come from main only; tag pushes are gated by who can push tags.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve and check the version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$file_version" ]]; then
            echo "::error::Requested version '$version' does not match the VERSION file ('$file_version')."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build the app and the CLI
        run: scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Attest the app and the CLI
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/GHLive-${{ needs.build.outputs.version }}-macos-universal.zip
            dist/ghlive-${{ needs.build.outputs.version }}-macos-universal.tar.gz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${VERSION}"
          # A tag that already exists must point at the commit that was built and attested.
          # Resolved through the API: checkout's fetch-tags fails on tag-triggered runs ("Cannot fetch both").
          if tag_commit="$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha 2>/dev/null)"; then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag ${tag} points at ${tag_commit}, not at the built commit ${GITHUB_SHA}. Refusing to publish."
              exit 1
            fi
          fi
          scripts/release-notes.sh "$VERSION" > release-notes.md
          assets=(dist/*.zip dist/*.zip.sha256 dist/*.tar.gz dist/*.tar.gz.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md \
              --prerelease="$PRERELEASE"
          else
            gh release create "$tag" "${assets[@]}" \
              --title "GHLive ${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease="$PRERELEASE"
          fi
